[package]
name = "pv-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable event bridge: EventBus trait, embedded file-backed broker, manifest provisioning"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
pv-core = { workspace = true }
pv-events = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
jsonschema = { workspace = true }

[features]
default = []
# Two-phase authenticated cold-tier archive (object_store-backed).
cold-store = [
    "dep:object_store",
    "dep:url",
    "dep:hmac",
    "dep:sha2",
    "dep:hex",
    "dep:pv-receipts",
    "dep:tokio",
    "dep:futures",
]
# NATS JetStream connector (edge/single-node alternative, brief Module F).
nats = [
    "dep:async-nats",
    "dep:rustls-tls",
    "dep:tokio",
    "dep:futures",
    "cold-store",
]
# Kafka-wire connector (works against Redpanda, brief's reference broker).
kafka = [
    "dep:rskafka",
    "dep:rdkafka",
    "dep:rustls-tls",
    "dep:rustls-pki-types",
    "dep:tokio",
    "dep:chrono",
    "cold-store",
]
# S3-compatible cold-tier targets (`s3://` cold_uri; AWS_* env credentials).
cold-store-aws = ["cold-store", "object_store/aws"]

[dependencies.async-nats]
version = "0.50"
optional = true

# zstd is left out on purpose. rskafka 0.6 pins zstd 0.13, which has
# RUSTSEC-2026-0391/0398/0403/0410, and the fixes exist only in zstd 0.14.
# 0403 is reachable here: fetched batches come from the broker, and the
# `legacy` frame decoder can expose uninitialized memory on a bad frame.
# ProofVisor produces with `Compression::NoCompression`, so a zstd batch on
# our topics can only come from another writer; fetching one now fails with
# "Unimplemented compression" instead of being decoded. Re-enable
# `compression-zstd` once rskafka depends on zstd >= 0.14.3.
[dependencies.rskafka]
version = "0.6"
optional = true
default-features = false
features = ["transport-tls", "compression-gzip", "compression-lz4", "compression-snappy"]

# rskafka 0.6 and async-nats share the rustls 0.23 line; `rustls-tls` is
# the workspace-wide client-config surface for both connectors. PEM
# parsing comes from rustls-pki-types (rustls-pemfile is archived,
# RUSTSEC-2025-0134).
[dependencies.rustls-tls]
package = "rustls"
version = "0.23"
optional = true
default-features = false
features = ["ring", "std", "tls12"]

[dependencies.rustls-pki-types]
version = "1.9"
optional = true

[dependencies.rdkafka]
workspace = true
optional = true

[dependencies.chrono]
version = "0.4"
optional = true
default-features = false
features = ["clock"]

[dependencies.tokio]
workspace = true
optional = true

[dependencies.futures]
workspace = true
optional = true

[dependencies.object_store]
workspace = true
optional = true
features = ["fs"]

[dependencies.url]
workspace = true
optional = true

[dependencies.hmac]
workspace = true
optional = true

[dependencies.sha2]
workspace = true
optional = true

[dependencies.hex]
workspace = true
optional = true

[dependencies.pv-receipts]
workspace = true
optional = true

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

# Live S3 cold-tier contract (tests/cold_store_live.rs, PV_COLD_S3_URL-gated)
# reads exported objects back directly. Feature-unification also gives the
# library's `parse_url_opts` s3:// support inside test builds.
[dev-dependencies.object_store]
workspace = true
features = ["fs", "aws"]

[lints]
workspace = true
