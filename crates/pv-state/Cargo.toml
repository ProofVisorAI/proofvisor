[package]
name = "pv-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Atomic counters, token velocity, rate limits, action budgets (StateStore)"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
pv-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# Redis Cluster backend (brief §8); requires a live server, contract tests gated on PV_REDIS_URL.
redis = ["dep:redis", "dep:r2d2", "dep:rustls-tls"]

[dependencies.redis]
version = "0.27"
optional = true
default-features = false
features = ["script", "r2d2", "cluster", "tls-rustls"]

[dependencies.rustls-tls]
package = "rustls"
version = "0.23"
optional = true
default-features = false
features = ["ring", "std", "tls12"]

[dependencies.r2d2]
workspace = true
optional = true

[dev-dependencies]
proptest = { workspace = true }
pv-core = { workspace = true }

[lints]
workspace = true
