# Cloud Foundry deployment example. See README.md in this directory for setup.
# Only an internal route is mapped. Authentication is required and the
# unauthenticated dashboard is disabled by harness.cloudfoundry.toml.
applications:
- name: proofvisor
  docker:
    image: registry.example.com/proofvisor:cf
  instances: 1
  memory: 256M
  disk_quota: 1G
  routes:
  - route: proofvisor.apps.internal
  health-check-type: http
  health-check-http-endpoint: /livez
  # Requires the readiness-capable foundation releases listed in README.md.
  readiness-health-check-type: http
  readiness-health-check-http-endpoint: /readyz
  readiness-health-check-interval: 5
  readiness-health-check-invocation-timeout: 3
  env:
    PV_CONFIG: /app/config/harness.cloudfoundry.toml
    # Set this required variable using a protected --vars-file.
    PV_STATE_ENDPOINT: ((redis_url))
    RUST_LOG: info
